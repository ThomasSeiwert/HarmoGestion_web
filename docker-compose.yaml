name: harmogestion

services:

  db:
    image: mysql:latest
    container_name: mysql
    restart: always
    ports:
      - "3396:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./dossierconception/scripts:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci


  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin:latest
    restart: always
    ports:
      - "9080:80"
    environment:
      PMA_HOST: ${DB_HOST}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

  api:
    depends_on:
      - db
    image: cvert/harmogestion-api:latest
    restart: always
    ports:
      - "9004:9004"
    environment:
      HARMOGESTION_DB_USERNAME: ${DB_USERNAME}
      HARMOGESTION_DB_PASSWORD: ${DB_PASSWORD}
      HARMOGESTION_DB_HOST: ${DB_HOST}
      HARMOGESTION_DB_PORT: ${DB_PORT}
      HARMOGESTION_API_PORT: ${API_PORT}
    command: ['java', '-jar', '/app/harmoGestionAPI.jar']

  web:
    depends_on:
      - api
    image: cvert/harmogestion-web:latest
    restart: always
    ports:
      - "9005:9005"
    environment:
      HARMOGESTION_API_HOST: ${API_HOST}
      HARMOGESTION_API_PORT: ${API_PORT}
      HARMOGESTION_WEB_PORT: ${WEB_PORT}
    command: [ 'java', '-jar', '/app/harmoGestionWEB.jar' ]

volumes:
  db_data: